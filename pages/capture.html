<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyx Volume Capture</title>
    <style>
      html, body, #root {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 90% 60% at 50% -15%, rgba(0, 80, 160, 0.24), transparent 72%),
          radial-gradient(ellipse 60% 45% at 12% 35%, rgba(78, 196, 255, 0.1), transparent 68%),
          radial-gradient(ellipse 55% 40% at 88% 55%, rgba(124, 108, 240, 0.1), transparent 70%),
          radial-gradient(ellipse 70% 42% at 50% 108%, rgba(0, 50, 110, 0.22), transparent 62%),
          radial-gradient(ellipse 85% 75% at 50% 45%, transparent 35%, rgba(0, 0, 0, 0.5) 100%),
          #050a14;
      }

      /* Ensure vtk root container has real layout height. */
      #root,
      .capture-volume,
      .capture-volume > div {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/capture/main.tsx"></script>
  </body>
</html>

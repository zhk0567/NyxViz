<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyx Volume Capture</title>
    <style>
      html, body, #root {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0e1a;
      }

      /* Ensure vtk root container has real layout height. */
      #root,
      .capture-volume,
      .capture-volume > div {
        width: 100%;
        height: 100%;
      }

      .capture-step-badge {
        position: fixed;
        right: 28px;
        bottom: 24px;
        padding: 10px 18px;
        border-radius: 10px;
        background: rgba(6, 10, 20, 0.78);
        border: 1px solid rgba(78, 196, 255, 0.35);
        color: #e8f4ff;
        font: 600 28px/1.2 system-ui, sans-serif;
        letter-spacing: 0.02em;
        pointer-events: none;
        z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/capture/main.tsx"></script>
  </body>
</html>
